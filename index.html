<style>
  html.sl, html.sl body { overflow: hidden !important; }

  html.sl > body > main { visibility: hidden !important; }
</style>
<script>

if ("scrollRestoration" in history) history.scrollRestoration = "manual";

<body>
<div id="ld" role="status" aria-live="polite" aria-label="Loading"><div class="ld-bg"></div><div class="ld-dial"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ld-ring" cx="50" cy="50" r="42"/></svg><div class="ld-orbit"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ld-knob" cx="50" cy="21" r="5.85"/></svg></div></div><div class="ld-s" aria-hidden="true"><span class="ld-a">Initializing system<span class="ld-dots"><i></i><i></i><i></i></span></span><span class="ld-b">System ready<i class="ld-ok"></i></span></div><span class="ld-sr">Loading zahid.os</span></div>


<header>
  <button class="logo" id="home" aria-label="zahid.os, back to top"><span class="lg-m" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lg-t" aria-hidden="true">zahid<b>.os</b><u></u></span></button>
  <nav aria-label="Sections">
    <button class="nav" data-run="about" aria-label="About"><i class="l" aria-hidden="true">[</i><span class="t" data-text="ABOUT" aria-hidden="true">ABOUT</span><i class="r" aria-hidden="true">]</i><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20.5c.5-3.5 3.5-5.5 6.5-5.5s6 2 6.5 5.5"/></svg></button>
    <button class="nav" data-run="works" aria-label="Works"><i class="l" aria-hidden="true">[</i><span class="t" data-text="WORKS" aria-hidden="true">WORKS</span><i class="r" aria-hidden="true">]</i><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></button>
    <button class="nav" data-run="services" aria-label="Services"><i class="l" aria-hidden="true">[</i><span class="t" data-text="SERVICES" aria-hidden="true">SERVICES</span><i class="r" aria-hidden="true">]</i><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 L20.5 7 V17 L12 21.5 L3.5 17 V7 Z"/><circle cx="12" cy="12" r="2.8"/></svg></button>
    <button class="nav" data-run="connect" aria-label="Connect"><i class="l" aria-hidden="true">[</i><span class="t" data-text="CONNECT" aria-hidden="true">CONNECT</span><i class="r" aria-hidden="true">]</i><svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.5 7 L12 13 L20.5 7"/></svg></button>
  </nav>
  <svg id="dial" title="Drag to change the time of day" viewBox="0 0 100 100" tabindex="0" role="slider" aria-label="Time of day"
       aria-valuemin="0" aria-valuemax="24" aria-valuenow="12">
    <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="var(--dim)" stroke-width="1.5"/>
    <circle id="knob" r="8" fill="var(--ac)"/>
  </svg>
</header>

<main>
  <h1>Zahid</h1>
  <div id="panel" aria-live="polite"><p class="sub">CSE student in Dhaka. Drag the dial to change the theme.</p></div>
</main>
