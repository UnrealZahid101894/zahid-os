<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>zahid.os</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@300;400;500;600&family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/one-page.css">
<link rel="stylesheet" href="css/sections/home.css">
<link rel="stylesheet" href="css/sections/connect.css">
<link rel="stylesheet" href="css/sections/services.css">
<link rel="stylesheet" href="css/sections/works.css">
<link rel="stylesheet" href="css/sections/works-scroll.css">
<link rel="stylesheet" href="css/sections/about.css">
<link rel="stylesheet" href="css/loader.css">
<link rel="stylesheet" href="css/cursor.css">
<link rel="stylesheet" href="css/rail.css">
<link rel="stylesheet" href="css/perf.css">
<style>
  html.sl, html.sl body { overflow: hidden !important; }
  html.sl > body > header,
  html.sl > body > main { visibility: hidden !important; }
</style>
<script>
// Runs before the browser restores scroll position. Must be classic (not module).
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
document.documentElement.classList.add("sl");
</script>
</head>
<body>
<div id="ld" role="status" aria-live="polite" aria-label="Loading"><div class="ld-bg"></div><div class="ld-dial"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ld-ring" cx="50" cy="50" r="42"/></svg><div class="ld-orbit"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ld-knob" cx="50" cy="21" r="5.85"/></svg></div></div><div class="ld-s" aria-hidden="true"><span class="ld-a">Initializing system<span class="ld-dots"><i></i><i></i><i></i></span></span><span class="ld-b">System ready<i class="ld-ok"></i></span></div><span class="ld-sr">Loading zahid.os</span></div>


<header>
  <button class="logo" id="home" aria-label="zahid.os, back to top"><span class="lg-m" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="lg-t" aria-hidden="true">zahid<b>.os</b><u></u></span></button>
  <nav aria-label="Sections">
    <button class="nav" data-run="about" aria-label="About"><i class="l" aria-hidden="true">[</i><span class="t" data-text="ABOUT" aria-hidden="true">ABOUT</span><i class="r" aria-hidden="true">]</i></button>
    <button class="nav" data-run="works" aria-label="Works"><i class="l" aria-hidden="true">[</i><span class="t" data-text="WORKS" aria-hidden="true">WORKS</span><i class="r" aria-hidden="true">]</i></button>
    <button class="nav" data-run="services" aria-label="Services"><i class="l" aria-hidden="true">[</i><span class="t" data-text="SERVICES" aria-hidden="true">SERVICES</span><i class="r" aria-hidden="true">]</i></button>
    <button class="nav" data-run="connect" aria-label="Connect"><i class="l" aria-hidden="true">[</i><span class="t" data-text="CONNECT" aria-hidden="true">CONNECT</span><i class="r" aria-hidden="true">]</i></button>
  </nav>
  <svg id="dial" title="Drag to change the time of day" viewBox="0 0 100 100" tabindex="0" role="slider" aria-label="Time of day"
       aria-valuemin="0" aria-valuemax="24" aria-valuenow="12">
    <circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="var(--dim)" stroke-width="1.5"/>
    <circle id="knob" r="8" fill="var(--ac)"/>
  </svg>
</header>

<main>
  <h1>Zahid</h1>
  <div id="panel" aria-live="polite"><p class="sub">CSE student in Dhaka. Drag the dial to change the theme.</p></div>
</main>

<script type="module" src="js/main.js"></script>
</body>
</html>
